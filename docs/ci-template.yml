name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build standalone app
        run: npm run build
      - name: Pixel, text and page-matching tests
        run: npm test
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Offline interface and highlighted comparison tests
        run: npm run test:browser
      - name: Offline whole-document tests
        run: npm run test:batch
